<!doctype html>
<html lang="de">
  <body style="margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1c1c1e">
    <div style="max-width:520px;margin:0 auto;padding:40px 20px">
      <div style="background:#fff;border-radius:20px;padding:32px;text-align:center">
        <div style="font-size:18px;font-weight:700">Klangradar</div>
        <h1 style="font-size:26px;margin:28px 0 10px">E-Mail bestätigen</h1>
        <p style="font-size:16px;line-height:1.5;color:#636366;margin:0">Gib diesen sechsstelligen Code in der Klangradar App ein:</p>
        <div style="font-size:34px;font-weight:700;letter-spacing:8px;margin:28px 0;color:#7b2cbf">{{ .Token }}</div>
        <p style="font-size:14px;line-height:1.5;color:#8e8e93;margin:0">Der Code ist 60 Minuten gültig. Falls du keinen Account erstellt hast, kannst du diese E-Mail ignorieren.</p>
      </div>
    </div>
  </body>
</html>
