name: Deploy Edge Functions

# Deployt automatisch nach Merge auf main, wenn sich etwas unter
# backend/supabase/functions/ ändert — bisher lief das ausschließlich
# manuell per `supabase functions deploy` von der Kommandozeile.
#
# Läuft gegen das `production`-Environment mit Required Reviewer: jeder
# Deploy braucht eine manuelle Freigabe in der Actions-UI, bevor er
# tatsächlich startet (kein automatischer Prod-Deploy ohne Blick auf den
# Diff).
on:
  push:
    branches: [main]
    paths: ["backend/supabase/functions/**", ".github/workflows/deploy-edge-functions.yml"]
  workflow_dispatch:

# Siehe deploy-migrations.yml für die Begründung — hier sogar wichtiger:
# ohne das könnte ein spät freigegebener alter Run einen bereits
# deployten neueren Funktionsstand stillschweigend wieder zurückrollen.
concurrency:
  group: deploy-edge-functions-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Alle Edge Functions deployen
        working-directory: backend
        run: supabase functions deploy --project-ref zqgzcspeqllrihfwmayn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # BROWSERLESS_API_TOKEN: von ingest-source/_shared/http/fetchRendered.ts
      # gebraucht (config.renderJs=true-Quellen, siehe PR #171) -- als
      # GitHub-Actions-Repo-Secret hinterlegt, nie im Klartext im Repo.
      # Läuft NUR, wenn das GH-Secret tatsächlich gesetzt ist (sonst
      # No-op) -- fehlt es, schlagen renderJs-Quellen mit einer klaren
      # Fehlermeldung fehl statt still leer zu bleiben.
      - name: Browserless-Secret setzen
        if: ${{ secrets.BROWSERLESS_API_TOKEN != '' }}
        working-directory: backend
        run: supabase secrets set BROWSERLESS_API_TOKEN="$BROWSERLESS_API_TOKEN" --project-ref zqgzcspeqllrihfwmayn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BROWSERLESS_API_TOKEN: ${{ secrets.BROWSERLESS_API_TOKEN }}
