name: Admin Dashboard CI

# Kein `paths:`-Filter mehr auf dem Trigger selbst: der Job muss auf JEDEM PR
# laufen (auch nur skippen), damit er als Required Status Check taugt — ein
# per `paths:` komplett unterdrückter Workflow-Run hinterlässt gar keinen
# Check und lässt den PR ewig auf "pending" hängen (GitHub behandelt einen
# innerhalb des Workflows via `if:` übersprungenen Job dagegen als "skipped",
# was für Required Checks als bestanden zählt).
on:
  pull_request:
  push:
    branches: [main]

# Veraltete Läufe desselben PRs abbrechen (neuer Push / update-branch):
# macOS-Runner sind knapp, alte Läufe blockierten sonst die aktuellen.
# Läufe auf main werden nie abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'admin/**'
              - '.github/workflows/admin-ci.yml'

  lint-and-build:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Build (ohne echte Supabase-Zugangsdaten — Datenrouten sind force-dynamic)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
