name: Admin Dashboard CI

# Created by ChatGPT Codex: prüft neben Build und Lint auch die öffentlich
# erreichbaren Links sowie Tastatur- und Navigationspfade im echten Browser.

# Kein `paths:`-Filter mehr auf dem Trigger selbst: der Job muss auf JEDEM PR
# laufen (auch nur skippen), damit er als Required Status Check taugt — ein
# per `paths:` komplett unterdrückter Workflow-Run hinterlässt gar keinen
# Check und lässt den PR ewig auf "pending" hängen (GitHub behandelt einen
# innerhalb des Workflows via `if:` übersprungenen Job dagegen als "skipped",
# was für Required Checks als bestanden zählt).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'admin/**'
              - '.github/workflows/admin-ci.yml'

  lint-and-build:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build (ohne echte Supabase-Zugangsdaten — Datenrouten sind force-dynamic)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      - name: Chromium für Browser-Tests installieren
        run: npx playwright install --with-deps chromium
      - name: Öffentliche Links prüfen
        run: npm run check:links
      - name: Öffentliche Browser- und Accessibility-Tests
        run: npm run test:e2e
