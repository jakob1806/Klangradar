name: Flutter CI

# Kein `paths:`-Filter mehr auf dem Trigger selbst, siehe admin-ci.yml für
# die Begründung (Required-Status-Check-Kompatibilität via skip statt
# komplett fehlendem Workflow-Run).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/flutter-ci.yml'

  analyze-and-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Env-Platzhalter anlegen
        run: cp .env.example .env

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
