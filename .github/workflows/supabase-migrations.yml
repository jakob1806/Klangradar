name: Supabase Migrations

# Kein `paths:`-Filter mehr auf dem Trigger selbst, siehe admin-ci.yml für
# die Begründung (Required-Status-Check-Kompatibilität via skip statt
# komplett fehlendem Workflow-Run).
on:
  pull_request:
  push:
    branches: [main]

# Veraltete Läufe desselben PRs abbrechen (neuer Push / update-branch):
# macOS-Runner sind knapp, alte Läufe blockierten sonst die aktuellen.
# Läufe auf main werden nie abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/supabase/**'
              - '.github/workflows/supabase-migrations.yml'

  migrate-and-seed:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Ein exakter Stand vermeidet den unauthentifizierten GitHub-API-
          # Aufruf zur Auflösung von `latest`, der bei Rate Limits bereits
          # vor dem eigentlichen Migrationstest fehlschlägt.
          version: 2.109.1

      - name: Lokale Supabase-Datenbank starten (Docker, im Runner vorinstalliert)
        working-directory: backend
        # Für den Migrationstest reicht die Datenbank allein (`db start` statt
        # `start`): ein Image statt neun. Am 29.10.2026 scheiterten Läufe an
        # "toomanyrequests: Data limit exceeded" der Standard-Registry
        # (public.ecr.aws) — deshalb bei Fehlern auf die Spiegel bei GitHub
        # und Docker Hub ausweichen, mit kurzer Pause dazwischen.
        run: |
          for registry in public.ecr.aws ghcr.io docker.io; do
            echo "Versuche Registry $registry"
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" supabase db start; then
              echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry" >> "$GITHUB_ENV"
              exit 0
            fi
            supabase stop --no-backup || true
            sleep 15
          done
          echo "Keine Registry lieferte das Datenbank-Image." >&2
          exit 1

      - name: Migrationen + Seed anwenden
        working-directory: backend
        run: supabase db reset

      - name: Supabase-Instanz stoppen
        if: always()
        working-directory: backend
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop
          fi
