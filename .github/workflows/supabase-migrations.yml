name: Supabase Migrations

# Kein `paths:`-Filter mehr auf dem Trigger selbst, siehe admin-ci.yml für
# die Begründung (Required-Status-Check-Kompatibilität via skip statt
# komplett fehlendem Workflow-Run).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/supabase/**'
              - '.github/workflows/supabase-migrations.yml'

  migrate-and-seed:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lokale Supabase-Instanz starten (Docker, im Runner vorinstalliert)
        working-directory: backend
        run: supabase start

      - name: Migrationen + Seed anwenden
        working-directory: backend
        run: supabase db reset

      - name: Supabase-Instanz stoppen
        if: always()
        working-directory: backend
        run: supabase stop
