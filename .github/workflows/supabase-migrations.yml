name: Supabase Migrations

# Kein `paths:`-Filter mehr auf dem Trigger selbst, siehe admin-ci.yml für
# die Begründung (Required-Status-Check-Kompatibilität via skip statt
# komplett fehlendem Workflow-Run).
on:
  pull_request:
  push:
    branches: [main]

# Veraltete Läufe desselben PRs abbrechen (neuer Push / update-branch):
# macOS-Runner sind knapp, alte Läufe blockierten sonst die aktuellen.
# Läufe auf main werden nie abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/supabase/**'
              - '.github/workflows/supabase-migrations.yml'

  migrate-and-seed:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Ein exakter Stand vermeidet den unauthentifizierten GitHub-API-
          # Aufruf zur Auflösung von `latest`, der bei Rate Limits bereits
          # vor dem eigentlichen Migrationstest fehlschlägt.
          version: 2.109.1

      - name: Lokale Supabase-Instanz starten (Docker, im Runner vorinstalliert)
        working-directory: backend
        # Mailpit/Imgproxy/Studio werden für Migrationstests nicht gebraucht; die
        # Images sind zeitweise nicht mehr öffentlich abrufbar ("pull access denied").
        run: supabase start -x imgproxy,inbucket,mailpit,studio,edge-runtime,analytics,vector

      - name: Migrationen + Seed anwenden
        working-directory: backend
        run: supabase db reset

      - name: Supabase-Instanz stoppen
        if: always()
        working-directory: backend
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop
          fi
