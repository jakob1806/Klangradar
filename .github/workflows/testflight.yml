name: TestFlight

# Erstellt von Claude Code (06.11.2026): baut die iOS-App nach jedem Merge auf
# main in der Cloud und lädt sie zu TestFlight hoch – unabhängig vom Laptop.
# Öffentliches Repo: macOS-Minuten sind kostenlos.
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID  App-Store-Connect-API-Schlüssel (Rolle Admin/App Manager)
#   ASC_KEY_P8                 Inhalt der AuthKey_XXXX.p8
#   SECRETS_PLIST_BASE64       base64 von ios-native/Config/Secrets.plist
# Optional (Variables): BUILD_NUMBER_BASE, Standard 900 (Build = Basis + Laufnummer).
on:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@v4

      - name: Secrets vorhanden?
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::warning::ASC_KEY_ID fehlt – TestFlight-Upload übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Neueste Xcode-Version wählen
        if: steps.check.outputs.ok == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Schlüssel und Konfiguration ablegen
        if: steps.check.outputs.ok == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SECRETS_PLIST_BASE64: ${{ secrets.SECRETS_PLIST_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          printf '%s' "$SECRETS_PLIST_BASE64" | base64 --decode > Config/Secrets.plist

      - name: Archivieren und hochladen
        if: steps.check.outputs.ok == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BASE: ${{ vars.BUILD_NUMBER_BASE || '900' }}
          SKIP_UI_TESTS: "1"
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          export BUILD_NUMBER=$(( BASE + GITHUB_RUN_NUMBER ))
          ./upload-testflight.sh

      - name: Aufräumen
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" Config/Secrets.plist
