name: Deploy Migrations to Production

# Wendet neue Migrationen nach Merge auf main gegen das echte
# Supabase-Projekt an (`supabase db push`). Der bestehende
# supabase-migrations.yml-Workflow prüft nur, dass Migrationen sauber gegen
# eine frische lokale/ephemere Instanz laufen — er berührt Produktion nie.
#
# Läuft gegen das `production`-Environment mit Required Reviewer: jeder
# Migrations-Push braucht eine manuelle Freigabe in der Actions-UI. Es gibt
# aktuell kein Staging-Projekt, das ist bewusst der einzige Schutz vor einem
# ungeprobten Schema-Change in Produktion.
on:
  push:
    branches: [main]
    paths: ["backend/supabase/migrations/**", ".github/workflows/deploy-migrations.yml"]
  workflow_dispatch:

# Freigaben verzögern sich oft (manueller Klick in der Actions-UI) — bei
# mehreren schnell aufeinanderfolgenden Merges kann ein älterer Run erst
# NACH einem neueren freigegeben werden und dann fehlschlagen ("Remote
# migration versions not found in local migrations directory", weil die
# DB inzwischen weiter ist als der zu diesem alten Commit ausgecheckte
# Stand). cancel-in-progress verwirft veraltete Runs komplett, statt sie
# gegen einen überholten Checkout laufen zu lassen.
concurrency:
  group: deploy-migrations-production
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # `supabase db push` kennt (anders als `functions deploy`) kein
      # --project-ref — es pusht immer gegen das gelinkte Projekt, deshalb
      # erst linken.
      - name: Projekt linken
        working-directory: backend
        run: supabase link --project-ref zqgzcspeqllrihfwmayn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Einmaliger Reparatur-Schritt: eine parallel laufende Session hat
      # ihre Stadt-Erweiterungs-Migrationen zunächst unter der Nummerierung
      # 20261030* direkt gegen Produktion gepusht, dann wegen einer
      # Nummern-Kollision mit dieser Session lokal auf 20261031* umbenannt
      # und erneut gepusht — die alten 20261030*-Versionsnummern (plus ein
      # einzelner Ausreißer 20261031000022 ohne zugehörige Datei) blieben
      # dadurch als verwaiste Einträge in der entfernten
      # Migrations-Historie zurück und blockierten jeden weiteren
      # `db push` ("Remote migration versions not found in local
      # migrations directory"). `migration repair --status reverted`
      # ändert AUSSCHLIESSLICH die Buchführungs-Tabelle
      # supabase_migrations.schema_migrations, führt keinerlei SQL gegen
      # Anwendungstabellen aus — betrifft also nie echte Daten. Idempotent:
      # ein bereits als reverted markierter Eintrag bleibt bei erneutem
      # Lauf unverändert. Sobald diese verwaisten Einträge endgültig
      # bereinigt sind, kann dieser Schritt wieder entfernt werden.
      - name: Verwaiste Migrations-Historie reparieren
        working-directory: backend
        run: |
          supabase migration repair --status reverted \
            20261030000001 20261030000002 20261030000004 20261030000005 \
            20261030000006 20261030000007 20261030000008 20261030000009 \
            20261030000010 20261030000011 20261030000012 20261030000013 \
            20261030000014 20261030000015 20261030000016 20261030000017 \
            20261030000018 20261030000019 20261030000020 20261031000022
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Migrationen gegen Produktion anwenden
        working-directory: backend
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
