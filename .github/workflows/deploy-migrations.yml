name: Deploy Migrations to Production

# Wendet neue Migrationen nach Merge auf main gegen das echte
# Supabase-Projekt an (`supabase db push`). Der bestehende
# supabase-migrations.yml-Workflow prüft nur, dass Migrationen sauber gegen
# eine frische lokale/ephemere Instanz laufen — er berührt Produktion nie.
#
# Läuft gegen das `production`-Environment mit Required Reviewer: jeder
# Migrations-Push braucht eine manuelle Freigabe in der Actions-UI. Es gibt
# aktuell kein Staging-Projekt, das ist bewusst der einzige Schutz vor einem
# ungeprobten Schema-Change in Produktion.
on:
  push:
    branches: [main]
    paths: ["backend/supabase/migrations/**", ".github/workflows/deploy-migrations.yml"]
  workflow_dispatch:

# Freigaben verzögern sich oft (manueller Klick in der Actions-UI) — bei
# mehreren schnell aufeinanderfolgenden Merges kann ein älterer Run erst
# NACH einem neueren freigegeben werden und dann fehlschlagen ("Remote
# migration versions not found in local migrations directory", weil die
# DB inzwischen weiter ist als der zu diesem alten Commit ausgecheckte
# Stand). cancel-in-progress verwirft veraltete Runs komplett, statt sie
# gegen einen überholten Checkout laufen zu lassen.
concurrency:
  group: deploy-migrations-production
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # `supabase db push` kennt (anders als `functions deploy`) kein
      # --project-ref — es pusht immer gegen das gelinkte Projekt, deshalb
      # erst linken.
      - name: Projekt linken
        working-directory: backend
        run: supabase link --project-ref zqgzcspeqllrihfwmayn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Migrationen gegen Produktion anwenden
        working-directory: backend
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
